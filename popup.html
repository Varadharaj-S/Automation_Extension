<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #4d9de0;
    }
    .header p {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }
    .status-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.82rem;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .pairing-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .pairing-box h2 {
      font-size: 0.82rem;
      color: #4d9de0;
      margin-bottom: 6px;
    }
    .pairing-box .section-desc {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .status-row:last-child { margin-bottom: 0; }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge.ok    { background: #166534; color: #86efac; }
    .badge.warn  { background: #7c2d12; color: #fdba74; }
    .badge.none  { background: #1e3a5f; color: #93c5fd; }
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
      margin-bottom: 8px;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4d9de0; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-sm {
      font-size: 0.78rem;
      padding: 7px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
    }
    .msg {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    .msg.success { background: #14532d; color: #86efac; display: block; }
    .msg.error   { background: #7f1d1d; color: #fca5a5; display: block; }
    .msg.info    { background: #1e3a5f; color: #93c5fd; display: block; }
    .divider {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 12px 0;
    }
    #serverInput {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .label { font-size: 0.72rem; color: #64748b; margin-bottom: 4px; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ DSA Tracker</h1>
    <p>LeetCode Cookie Connector</p>
  </div>

  <div class="status-box" id="statusBox">
    <div class="status-row">
      <span>LeetCode Session</span>
      <span class="badge none" id="sessionBadge">Checking…</span>
    </div>
    <div class="status-row">
      <span>CSRF Token</span>
      <span class="badge none" id="csrfBadge">Checking…</span>
    </div>
    <div class="status-row">
      <span>Server</span>
      <span class="badge none" id="serverBadge">Not set</span>
    </div>
    <div class="status-row">
      <span>Extension Paired</span>
      <span class="badge none" id="pairBadge">Checking…</span>
    </div>
  </div>

  <label class="label">DSA Tracker Server URL</label>
  <input id="serverInput" type="url" placeholder="https://your-app.onrender.com">

  <div class="pairing-box">
    <h2>🔐 Extension Pairing</h2>
    <p class="section-desc">
      Go to Settings on the DSA Tracker site while logged in, generate an
      extension token, and paste it here. This only needs to be done once.
    </p>
    <label class="label">Extension Token</label>
    <input id="tokenInput" type="text" placeholder="Paste token here">
    <button class="btn btn-sm" id="pairBtn" style="margin-top:4px">Pair Extension</button>
  </div>

  <button class="btn btn-primary" id="connectBtn">🔗 Connect LeetCode</button>
  <button class="btn btn-sm" id="clearBtn">Clear saved cookies &amp; pairing</button>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
